version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333" # Porta da API REST e Web UI
      - "6334:6334" # Porta gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  qdrant_storage: