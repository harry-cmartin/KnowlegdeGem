spring:
  application:
    name: KnowledgeGem
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: KnowledgeGem_collection
        use-tls: false
        initialize-schema: true



